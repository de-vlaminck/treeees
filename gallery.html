        <link rel="dns-prefetch" href="https://treetrustmn.maps.arcgis.com">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script type="speculationrules">
        {
            "prerender": [

       <style>
        body {
            font-family: "Roboto", sans-serif;
        }

        .row {
            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .column {
            width: 100%;
            aspect-ratio: 1 / 1; 
            box-sizing: border-box;
        }

        .column img {
            opacity: 1;
            cursor: pointer;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover; 
            border: 1px solid transparent; 
        }

        .column img:hover {
            opacity: 0.8;
	        transform: scale(1.05);
        }

        .row::after {
            content: "";
            display: table;
            clear: both;
        }

        .gallerycontainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9); 
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000; 
        }

        #expandedImg {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain; 
        }

        #imgtext {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 4px;
        }

        .closebtn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 45px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .closebtn:hover {
            color: #ccc;
        }
        </style>
    </head>

<body>
    <header>
    <nav>

<div id="container">
    <div class="content">
        <h1>Gallery</h1>
        <div class="row">
            <div class="column">
            <img src="gravel.jpg" alt="Trees in our gravel bed" onclick="myFunction(this);">
            </div>

            <div class="column">
            <img src="shoe.jpg" alt="The Shoe Tree!" onclick="myFunction(this);">
            </div>          

            <div class="column">
            <img src="tree.jpg" alt="Free tree in its new home!" onclick="myFunction(this);">
            </div>

            <div class="column">
            <img src="36 art.jpg" alt="Community tree planting!" onclick="myFunction(this);">
            </div>

            <div class="column">
            <img src="stp.jpg" alt="Boulevard in St Paul" onclick="myFunction(this);">
            </div>

            <div class="column">
            <img src="north.jpg" alt="Free trees at businesses in North Minneapolis" onclick="myFunction(this);">
            </div>  

            <div class="column">
            <img src="blvd.jpg" alt="Boulevard in Minneapolis!" onclick="myFunction(this);">
            </div>

            <div class="column">
            <img src="river.jpg" alt="Minnesota River" onclick="myFunction(this);">
            </div>

            <div class="column">
            <img src="walker.jpg" alt="The Walker Sculpture Garden" onclick="myFunction(this);">
            </div>

            <div class="column">
            <img src="fountain.jpg" alt="Irvine Park in St Paul" onclick="myFunction(this);">
            </div>

            <div class="column">
            <img src="miss.jpg" alt="Missouri River" onclick="myFunction(this);">

            <div class="column">
            <img src="noah2.jpg" alt="Trees for residents!" onclick="myFunction(this);">
            </div>
        </div>
    </div>
</div>


<!-- fullscreen expanding image  -->
<div class="gallerycontainer">
    <!-- Close the image -->
    <span onclick="this.parentElement.style.display='none'" class="closebtn">&times;</span>

    <img id="expandedImg">

    <div id="imgtext"></div>
</div>
    <script>
    function myFunction(imgs) {
    var expandImg = document.getElementById("expandedImg");
    var imgText = document.getElementById("imgtext");
    expandImg.src = imgs.src;
    imgText.innerHTML = imgs.alt;
    
    expandImg.parentElement.style.display = "flex";
    }
    </script>

</body>
